<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>SLY VOICE — Assistant Vocal</title>
<meta name="theme-color" content="#1F6FFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sly">
<link rel="apple-touch-icon" sizes="180x180" href="assets/sly_icon_180.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/sly_icon_180.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#05070A;--card:#0D1117;--card2:#111820;
  --blue:#1F6FFF;--violet:#7A3CFF;--cyan:#00E5FF;--green:#1EFF8E;--gold:#FFD700;--red:#FF3B5C;
  --text:#E8ECF4;--text2:#8B95A8;--text3:#4A5468;
  --border:rgba(255,255,255,0.07);
}
html{background:var(--bg) !important;height:100%;height:-webkit-fill-available;height:100dvh}
html,body{min-height:100vh;min-height:100dvh;min-height:-webkit-fill-available;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Inter','SF Pro Display',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
body{position:fixed;inset:0;background:var(--bg) !important}
@supports (-webkit-touch-callout:none){
  html,body{min-height:-webkit-fill-available}
}

/* ═══ 10 THÈMES — selector dans Réglages ═══ */
body[data-theme="neural"]{--bg:#05070A;--blue:#1F6FFF;--cyan:#00E5FF;--violet:#7A3CFF;--green:#1EFF8E;--gold:#FFD700;--red:#FF3B5C}
body[data-theme="red-strike"]{--bg:#0A0303;--blue:#FF1F1F;--cyan:#FF6B6B;--violet:#FF3838;--green:#FFB347;--gold:#FFD700;--red:#FF0040}
body[data-theme="neon-green"]{--bg:#020A05;--blue:#1EFF8E;--cyan:#5DFFB0;--violet:#1EFFB6;--green:#00FF6E;--gold:#FFD700;--red:#FF3B5C}
body[data-theme="royal-purple"]{--bg:#0A0514;--blue:#9D4EDD;--cyan:#C77DFF;--violet:#7B2CBF;--green:#80FFDB;--gold:#FFD700;--red:#FF3B5C}
body[data-theme="golden"]{--bg:#0A0905;--blue:#FFD700;--cyan:#FFE66D;--violet:#FFAA00;--green:#FFCC33;--gold:#FFD700;--red:#FF3B5C}
body[data-theme="pure-cyan"]{--bg:#020A0A;--blue:#00E5FF;--cyan:#00FFFF;--violet:#00B8FF;--green:#00FFCC;--gold:#FFD700;--red:#FF3B5C}
body[data-theme="monochrome"]{--bg:#0A0A0A;--blue:#FFFFFF;--cyan:#CCCCCC;--violet:#999999;--green:#EEEEEE;--gold:#FFFFFF;--red:#FF3B5C}
body[data-theme="sunset"]{--bg:#0A0508;--blue:#FF6B6B;--cyan:#FFAA88;--violet:#C73E5F;--green:#FFD93D;--gold:#FFA500;--red:#FF3B5C}
body[data-theme="ocean"]{--bg:#020812;--blue:#0077B6;--cyan:#00B4D8;--violet:#1E88E5;--green:#48CAE4;--gold:#FFD700;--red:#FF3B5C}
body[data-theme="hacker"]{--bg:#000000;--blue:#00FF41;--cyan:#39FF14;--violet:#00FF7F;--green:#00FF41;--gold:#FFFF00;--red:#FF0000}

/* Background ciel étoilé */
body::before{content:'';position:fixed;inset:0;z-index:1;pointer-events:none;
  box-shadow:inset 0 0 80px 12px rgba(31,111,255,0.10);
  transition:box-shadow .8s;animation:edgeBreath 6s ease-in-out infinite}
body.speaking-state::before{box-shadow:inset 0 0 120px 18px rgba(0,229,255,0.18);animation:edgeBreath 1.4s ease-in-out infinite}
body.listening-state::before{box-shadow:inset 0 0 110px 16px rgba(30,255,142,0.16);animation:edgeBreath 1s ease-in-out infinite}
body.thinking-state::before{box-shadow:inset 0 0 100px 14px rgba(122,60,255,0.14)}
@keyframes edgeBreath{0%,100%{opacity:0.6}50%{opacity:1}}

body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(1px 1px at 22% 42%,rgba(0,229,255,.9) 100%,transparent),
  radial-gradient(1px 1px at 67% 29%,rgba(122,60,255,.85) 100%,transparent),
  radial-gradient(1.5px 1.5px at 39% 67%,rgba(255,255,255,.7) 100%,transparent),
  radial-gradient(1px 1px at 84% 72%,rgba(30,255,142,.6) 100%,transparent),
  radial-gradient(1px 1px at 12% 78%,rgba(255,255,255,.55) 100%,transparent),
  radial-gradient(1.5px 1.5px at 91% 14%,rgba(0,229,255,.7) 100%,transparent);
  animation:starsDrift 25s linear infinite}
@keyframes starsDrift{0%{transform:translate(0,0)}100%{transform:translate(-30px,20px)}}

/* TOPBAR */
.topbar{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:calc(56px + env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center;z-index:10;pointer-events:none}
.topbar > *{pointer-events:auto}
.gear-btn{width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);transition:.2s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.gear-btn:hover{background:rgba(31,111,255,.12);border-color:var(--blue);color:var(--text)}
.gear-btn:active{transform:scale(.92)}
#sly-title{position:fixed;top:calc(20px + env(safe-area-inset-top,0px));left:24px;font-family:'Orbitron','JetBrains Mono',monospace;font-size:14px;letter-spacing:.45em;color:var(--cyan);z-index:9;text-shadow:0 0 14px rgba(0,229,255,.5)}

/* CENTER LOGO */
.center-hub{position:fixed;top:24%;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:10px;z-index:5;pointer-events:none}
.logo-wrap{position:relative;width:140px;height:140px;display:flex;align-items:center;justify-content:center}
.logo-img{display:block;width:96px;height:96px;object-fit:cover;border-radius:50%;position:relative;z-index:5;animation:slyBreathe 3.4s ease-in-out infinite;filter:drop-shadow(0 0 14px rgba(0,229,255,0.55)) drop-shadow(0 0 28px rgba(31,111,255,0.45));clip-path:circle(46% at 50% 50%);background:radial-gradient(circle,#1a2030,#0D1117)}
.logo-img.speaking{filter:drop-shadow(0 0 22px rgba(0,229,255,1)) drop-shadow(0 0 44px rgba(31,111,255,0.7)) brightness(1.15)}
.logo-img.thinking{filter:drop-shadow(0 0 18px rgba(122,60,255,0.85)) drop-shadow(0 0 34px rgba(31,111,255,0.55))}
.logo-img.listening{filter:drop-shadow(0 0 20px rgba(0,229,255,0.95)) drop-shadow(0 0 38px rgba(0,229,255,0.55))}
@keyframes slyBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

.logo-wrap::before{content:'';position:absolute;inset:-30px;border-radius:50%;
  background:radial-gradient(circle at center,transparent 38%,rgba(31,111,255,0.32) 56%,rgba(0,229,255,0.16) 72%,transparent 90%);
  filter:blur(6px);z-index:1;animation:slyHalo 3.8s ease-in-out infinite}
.logo-wrap::after{content:'';position:absolute;inset:6px;border-radius:50%;
  border:1px solid rgba(0,229,255,0.30);z-index:2;
  box-shadow:0 0 18px rgba(0,229,255,0.18);
  animation:slyRing 4.2s ease-in-out infinite}
@keyframes slyHalo{0%,100%{opacity:0.55;transform:scale(1)}50%{opacity:0.9;transform:scale(1.08)}}
@keyframes slyRing{0%,100%{transform:scale(1);opacity:0.55}50%{transform:scale(1.06);opacity:0.85}}
body.listening-state .logo-wrap::after{border-color:rgba(30,255,142,0.7);box-shadow:0 0 22px rgba(30,255,142,0.35)}
body.thinking-state .logo-wrap::after{border-color:rgba(122,60,255,0.7);box-shadow:0 0 22px rgba(122,60,255,0.4)}
body.speaking-state .logo-wrap::after{border-color:rgba(0,229,255,0.85);box-shadow:0 0 28px rgba(0,229,255,0.5);animation:slyRing 1.8s ease-in-out infinite}
body.speaking-state .logo-wrap::before{animation:slyHalo 1.6s ease-in-out infinite}

/* Particules en orbite */
.orbit-dot{position:absolute;top:50%;left:50%;width:4px;height:4px;border-radius:50%;background:#00E5FF;box-shadow:0 0 8px rgba(0,229,255,0.9);transform-origin:0 0;z-index:3;pointer-events:none;opacity:0}
.orbit-dot:nth-child(1){background:#00E5FF;animation:orbFade 1.2s 1.8s forwards,orbit1 14s linear infinite}
.orbit-dot:nth-child(2){background:#7A3CFF;box-shadow:0 0 8px rgba(122,60,255,0.9);animation:orbFade 1.2s 2.1s forwards,orbit2 18s linear infinite reverse}
.orbit-dot:nth-child(3){background:#00E5FF;animation:orbFade 1.2s 2.4s forwards,orbit3 22s linear infinite}
.orbit-dot:nth-child(4){background:#1EFF8E;box-shadow:0 0 8px rgba(30,255,142,0.6);animation:orbFade 1.2s 2.7s forwards,orbit4 16s linear infinite reverse}
@keyframes orbFade{to{opacity:.85}}
@keyframes orbit1{from{transform:rotate(0deg) translateX(95px) rotate(0deg)}to{transform:rotate(360deg) translateX(95px) rotate(-360deg)}}
@keyframes orbit2{from{transform:rotate(60deg) translateX(82px) rotate(-60deg)}to{transform:rotate(420deg) translateX(82px) rotate(-420deg)}}
@keyframes orbit3{from{transform:rotate(180deg) translateX(105px) rotate(-180deg)}to{transform:rotate(540deg) translateX(105px) rotate(-540deg)}}
@keyframes orbit4{from{transform:rotate(270deg) translateX(75px) rotate(-270deg)}to{transform:rotate(630deg) translateX(75px) rotate(-630deg)}}

/* Status */
.status{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text3);letter-spacing:2px;font-family:'JetBrains Mono',monospace;text-transform:uppercase}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);transition:all .3s}
.status-dot.listening{background:var(--green);box-shadow:0 0 10px var(--green)}
.status-dot.thinking{background:var(--violet);box-shadow:0 0 10px var(--violet);animation:pulse 1s infinite}
.status-dot.speaking{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}

/* TRANSCRIPT — bulle encadrée */
.transcript{position:fixed;top:46%;left:50%;transform:translateX(-50%);width:90%;max-width:780px;text-align:center;z-index:5;pointer-events:none;padding:0 16px}
.transcript-box{background:rgba(13,17,23,0.62);border:1px solid rgba(0,229,255,0.22);border-radius:18px;padding:18px 22px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 12px 40px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.04);transition:opacity .4s,border-color .4s;opacity:0}
.transcript-box.visible{opacity:1}
body.speaking-state .transcript-box{border-color:rgba(0,229,255,0.45);box-shadow:0 12px 40px rgba(0,229,255,0.18),inset 0 1px 0 rgba(255,255,255,0.04)}
body.listening-state .transcript-box{border-color:rgba(30,255,142,0.4)}
.user-text{font-size:13px;color:var(--text3);font-style:italic;margin-bottom:10px;opacity:0;transition:opacity .4s;font-family:'JetBrains Mono',monospace;letter-spacing:.5px;min-height:0;display:none}
.user-text.visible{display:block;opacity:1}
.ai-text{font-size:18px;font-weight:500;color:var(--text);line-height:1.55;letter-spacing:.3px;min-height:30px}
.ai-attr{font-size:10px;color:var(--text3);margin-top:10px;font-family:'JetBrains Mono',monospace;letter-spacing:1px;opacity:0;transition:opacity .5s}
.visible{opacity:1!important}

/* DYNAMIC ISLAND */
.dynamic-island{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-80px);background:#000;color:#fff;border-radius:24px;padding:8px 18px;display:flex;align-items:center;gap:10px;z-index:50;font-size:12px;font-family:'JetBrains Mono',monospace;letter-spacing:.5px;box-shadow:0 6px 22px rgba(0,229,255,0.25);transition:transform .35s cubic-bezier(.2,.9,.2,1);pointer-events:none;border:1px solid rgba(0,229,255,0.3)}
.dynamic-island.active{transform:translateX(-50%) translateY(calc(env(safe-area-inset-top,0px) + 4px))}
.di-dot{width:8px;height:8px;border-radius:50%;background:#00E5FF;box-shadow:0 0 8px #00E5FF;animation:diPulse 1s ease-in-out infinite}
@keyframes diPulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.4);opacity:1}}

/* WAVE BOND */
.bond-wave{position:fixed;top:50%;left:0;right:0;height:3px;pointer-events:none;z-index:4;opacity:0;transition:opacity .4s}
body.speaking-state .bond-wave{opacity:.55}
.bond-wave svg{width:100%;height:100%;display:block}
.bond-wave path{stroke:#00E5FF;stroke-width:1.2;fill:none;filter:drop-shadow(0 0 4px rgba(0,229,255,0.8))}

/* WHISPER BADGE */
.whisper-badge{position:fixed;top:calc(20px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:rgba(0,229,255,0.12);border:1px solid rgba(0,229,255,0.4);color:var(--cyan);padding:6px 14px;border-radius:14px;font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:2px;display:none;z-index:50}
body.whisper-mode .whisper-badge{display:block}

/* NIGHT MODE */
body.night-mode{filter:brightness(0.85) sepia(0.15) hue-rotate(-25deg) saturate(0.85)}

/* TACTICAL */
body.tactical-mode .topbar,body.tactical-mode #sly-title,body.tactical-mode .bottom-bar > .controls,body.tactical-mode .hint,body.tactical-mode .transcript,body.tactical-mode .center-hub{opacity:0;pointer-events:none;transition:opacity .4s}

/* BOTTOM BAR */
.bottom-bar{position:fixed;bottom:calc(32px + env(safe-area-inset-bottom,0px));left:0;right:0;z-index:10;display:flex;justify-content:center;align-items:center;gap:18px;padding:0 16px;opacity:0;animation:fi .5s 1.5s forwards;pointer-events:none}
.bottom-bar > *{pointer-events:auto}
@keyframes fi{to{opacity:1}}

.mic-btn{position:relative;width:68px;height:68px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#ff6b6b 0%,#e42020 45%,#a00d0d 100%);border:2px solid #320404;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .08s,box-shadow .15s,filter .15s;flex-shrink:0;box-shadow:0 4px 0 #4a0606,0 7px 18px rgba(255,30,30,.4),inset 0 2px 3px rgba(255,255,255,.45),inset 0 -3px 6px rgba(0,0,0,.4);touch-action:manipulation}
.mic-btn:hover{filter:brightness(1.08)}
.mic-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #4a0606,0 2px 6px rgba(255,30,30,.35)}
.mic-btn .mb-dot{width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.9)}
/* Mic = TOUJOURS rouge (Augustin 03/05) — change uniquement quand user clique pour écouter */
.mic-btn.user-listening{background:linear-gradient(180deg,#1EFF8E 0%,#0fa05a 100%);border-color:#5dffb0;animation:mic-glow 1.5s ease-in-out infinite}
@keyframes mic-glow{0%,100%{box-shadow:0 0 25px rgba(30,255,142,.4)}50%{box-shadow:0 0 45px rgba(30,255,142,.7)}}

.controls{display:flex;gap:0;align-items:center;justify-content:center;flex:0 0 auto;pointer-events:none}
.controls.left{padding-right:6px}
.controls.right{padding-left:6px}
.ctrl{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:var(--text2);padding:12px 20px;border-radius:22px;font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer;letter-spacing:.5px;transition:all .25s;-webkit-tap-highlight-color:transparent;white-space:nowrap;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 4px 14px rgba(0,0,0,.25);pointer-events:auto;touch-action:manipulation;font-weight:500}
.ctrl:hover{background:rgba(31,111,255,.12);border-color:var(--blue);color:var(--text)}
.ctrl:active{transform:scale(.95);background:rgba(31,111,255,.18)}
.ctrl.active{background:rgba(255,215,0,.12);border-color:rgba(255,215,0,.45);color:var(--gold)}

.hint{position:fixed;bottom:calc(125px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace;letter-spacing:1px;opacity:0;animation:fi .5s 2.5s forwards;z-index:5;text-align:center;width:90%;max-width:520px}
.hint kbd{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);padding:2px 6px;border-radius:4px;font-size:9px}

/* OUTILS PANEL */
.tools-panel{position:fixed;top:0;right:-420px;width:400px;max-width:100%;height:100vh;background:#0A0E14;border-left:1px solid rgba(0,229,255,.18);z-index:200;display:flex;flex-direction:column;transition:right .3s cubic-bezier(.2,.9,.2,1);box-shadow:-12px 0 40px rgba(0,0,0,.5);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.tools-panel.open{right:0}
.tools-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.06)}
.tools-title{font-family:'Orbitron','JetBrains Mono',monospace;font-size:13px;letter-spacing:.32em;color:#00E5FF}
.tools-close{background:transparent;border:none;color:var(--text2);font-size:28px;cursor:pointer;padding:0 6px;-webkit-tap-highlight-color:transparent}
.tools-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:16px;overflow-y:auto;flex:1}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px 10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:14px;color:var(--text);cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent;min-height:88px;touch-action:manipulation}
.tool:hover{background:rgba(31,111,255,.1);border-color:var(--blue);transform:translateY(-1px)}
.tool:active{transform:scale(.97)}
.tool-emoji{font-size:24px}
.tool-label{font-size:11px;font-family:'JetBrains Mono',monospace;letter-spacing:.4px;color:var(--text2);text-align:center;line-height:1.3}
.tools-result{padding:14px 18px;border-top:1px solid rgba(255,255,255,.06);max-height:40vh;overflow-y:auto;font-size:12px;line-height:1.5;color:var(--text);font-family:'JetBrains Mono',monospace;white-space:pre-wrap;word-break:break-word}
.tools-result:empty{display:none}
@media (max-width:520px){.tools-panel{width:100%;right:-100%}.tools-panel.open{right:0}}

/* SETTINGS PANEL */
.settings-panel{position:fixed;top:0;right:-440px;width:420px;max-width:100%;height:100vh;background:#0A0E14;border-left:1px solid var(--border);z-index:201;display:flex;flex-direction:column;transition:right .3s;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.settings-panel.open{right:0}
.settings-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border)}
.settings-title{font-family:'Orbitron','JetBrains Mono',monospace;font-size:13px;letter-spacing:.32em;color:var(--cyan)}
.settings-close{background:transparent;border:none;color:var(--text2);font-size:28px;cursor:pointer;padding:0 6px}
.settings-body{flex:1;overflow-y:auto;padding:18px 20px}
.setting{margin-bottom:18px}
.setting label{display:block;font-size:11px;font-family:'JetBrains Mono',monospace;letter-spacing:1px;color:var(--text2);margin-bottom:6px;text-transform:uppercase}
.setting select,.setting input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-family:inherit;font-size:13px}
.setting select:focus,.setting input:focus{outline:none;border-color:var(--blue)}
.toggle{display:flex;align-items:center;gap:10px;font-size:13px;cursor:pointer}
.toggle input{width:18px;height:18px;cursor:pointer}
#budgetDisplay{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--cyan);padding:8px 0}
.setting button.cam-btn{padding:9px 14px;font-size:11px;width:100%}
.setting button.cam-btn[id="resetBudgetBtn"],.setting button.cam-btn[id="resetSettingsBtn"]{background:rgba(255,59,92,.15);border-color:rgba(255,59,92,.4)}
.quick-clients{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:6px}
.quick-clients .cam-btn{padding:9px;font-size:11px}
.setting{border-bottom:1px solid rgba(255,255,255,.04);padding-bottom:14px}
.setting:last-child{border-bottom:none}
@media (max-width:520px){.settings-panel{width:100%;right:-100%}.settings-panel.open{right:0}}

/* CAMERA OVERLAY */
/* Confirm dialog */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:400;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.confirm-overlay.active{display:flex}
.confirm-box{background:#0A0E14;border:1px solid rgba(0,229,255,.3);border-radius:18px;padding:24px;max-width:90%;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.confirm-title{font-family:'Orbitron','JetBrains Mono',monospace;font-size:13px;letter-spacing:.32em;color:var(--cyan);margin-bottom:14px;text-transform:uppercase}
.confirm-msg{font-size:15px;line-height:1.55;color:var(--text);margin-bottom:20px}
.confirm-actions{display:flex;gap:12px;justify-content:flex-end}

.camera-overlay{position:fixed;inset:0;background:#000;display:none;z-index:300;flex-direction:column;align-items:center;justify-content:center}
.camera-overlay.active{display:flex}
.camera-overlay video{max-width:100%;max-height:70vh;border-radius:12px}
.cam-actions{display:flex;gap:14px;margin-top:18px}

.meeting-overlay.active{display:block}

.meeting-text{font-size:12px;color:var(--text2);max-height:80px;overflow-y:auto;line-height:1.5}

/* === FEATURES VISUELLES (Augustin 03/05) === */

/* #1 Animation 3 points pulsants quand thinking */
.thinking-dots{display:none;gap:4px;align-items:center;margin-top:8px}
body.thinking-state .thinking-dots{display:inline-flex}
.thinking-dots span{width:6px;height:6px;border-radius:50%;background:var(--violet);animation:thinkingDot 1.2s ease-in-out infinite}
.thinking-dots span:nth-child(2){animation-delay:.2s}
.thinking-dots span:nth-child(3){animation-delay:.4s}
@keyframes thinkingDot{0%,60%,100%{opacity:.3;transform:scale(.8)}30%{opacity:1;transform:scale(1.2)}}

/* #3 Halo conic qui tourne */
body.speaking-state .logo-wrap::before{
  background:conic-gradient(from 0deg,rgba(0,229,255,0.4),rgba(122,60,255,0.35),rgba(30,255,142,0.3),rgba(0,229,255,0.4));
  animation:slyHaloRotate 6s linear infinite,slyHalo 1.6s ease-in-out infinite}
@keyframes slyHaloRotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* #4 Glow réactif amplitude voix (scaled via JS in animateBondWave loop) */
body.speaking-state .logo-img{transition:transform 80ms,filter 200ms}

/* #6 Ondes radar quand listening (uniquement si user-initiated) */
body.listening-state .mic-btn.user-listening::before,
body.listening-state .mic-btn.user-listening::after{
  content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(30,255,142,0.6);
  animation:radarWave 1.6s ease-out infinite;pointer-events:none}
body.listening-state .mic-btn.user-listening::after{animation-delay:.8s}
body.no-radar .mic-btn::before,body.no-radar .mic-btn::after{display:none !important}
body.no-shooting-stars .shooting-star{display:none !important}
body.no-halo-rotate .logo-wrap::before{animation:slyHalo 3.8s ease-in-out infinite !important;background:radial-gradient(circle at center,transparent 38%,rgba(31,111,255,0.32) 56%,rgba(0,229,255,0.16) 72%,transparent 90%) !important}
@keyframes radarWave{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.4);opacity:0}}

/* #7 Logo qui cligne des yeux toutes les 8s — flash subtil */
.logo-img{animation:slyBreathe 3.4s ease-in-out infinite,slyBlink 8s linear infinite}
@keyframes slyBlink{0%,96%,100%{filter:drop-shadow(0 0 14px rgba(0,229,255,0.55)) drop-shadow(0 0 28px rgba(31,111,255,0.45))}97%,99%{filter:drop-shadow(0 0 14px rgba(0,229,255,0.55)) drop-shadow(0 0 28px rgba(31,111,255,0.45)) brightness(0.6)}}

/* #8 Étoiles filantes occasionnelles */
.shooting-star{position:fixed;width:2px;height:2px;background:linear-gradient(45deg,rgba(255,255,255,1),transparent);border-radius:50%;box-shadow:0 0 8px rgba(255,255,255,0.9),0 0 16px rgba(0,229,255,0.5);z-index:1;pointer-events:none;animation:shoot 1.8s linear forwards}
@keyframes shoot{from{transform:translate(0,0) scaleX(1);opacity:1}to{transform:translate(-300px,300px) scaleX(8);opacity:0}}

/* #9 Confettis success */
.confetti{position:fixed;width:6px;height:10px;border-radius:2px;z-index:200;pointer-events:none;animation:confettiFall 1.5s ease-out forwards}
@keyframes confettiFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(80vh) rotate(720deg);opacity:0}}

/* #10 Mode voyage soir auto — appliqué SUR html aussi pour couvrir safe area iOS */
html.travel-evening,body.travel-evening{background:linear-gradient(180deg,#05070A 0%,#0a0a1a 40%,#1a0a2e 100%) !important;background-attachment:fixed !important}

// API BASE — détecte automatiquement où on est

// Si on est sur GitHub Pages / Vercel / autre origine, fetch absolu vers tunnel.
const TUNNEL_URL = 'https://augustin-pc.tail69cd50.ts.net';
const API_BASE = (() => {
  const h = location.hostname;
  if (h === '127.0.0.1' || h === 'localhost' || h === 'augustin-pc.tail69cd50.ts.net') return '';
  return TUNNEL_URL;
})();
console.log('[sly] API_BASE =', API_BASE || '(same-origin)');

// Override fetch pour préfixer automatiquement les /api/*
const _origFetch = window.fetch;
window.fetch = function(input, init) {
  if (typeof input === 'string' && input.startsWith('/api/') && API_BASE) {
    input = API_BASE + input;
  }
  return _origFetch.call(this, input, init);
};

// ═══════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════
const ELEVEN_KEY = 'sk_fafae1063c72e1b1272ed88de37e4a96701000e1b4a6bf2d';
const VOICES = {
  bond:      { id:'hc35Qe8VnfDjptyUplY2', name:'James Bond' },
  kimi:      { id:'otquNlZtSVtghJ6lgySc', name:'Kimi' },
  bradpitt:  { id:'otquNlZtSVtghJ6lgySc', name:'Brad Pitt VF' },
  gandalf:   { id:'ELZkgHOQDx9VOO0Vt2u7', name:'Gandalf' },
  jafar:     { id:'Ruzu7HE1wfxYXIcLDV94', name:'Dr House' },
};
const Settings = {
  voice: 'bond',
  stability: 0.5,
  style: 0.2,
  speed: 1.0,
  nightAuto: true,
  haptic: true,
  proximity: true,
  autoGreet: true,
};

try {
  const saved = JSON.parse(localStorage.getItem('sly-settings') || '{}');
  Object.assign(Settings, saved);
} catch(_){}

function saveSettings() {
  try { localStorage.setItem('sly-settings', JSON.stringify(Settings)); } catch(_){}
}

const $ = id => document.getElementById(id);

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
let state = 'idle';
let listening = false;
let continuMode = false;
let _userInitiatedListen = false;
let recog = null;
let _slyAudio = null;
let _audioUnlocked = false;

const statusDot = $('statusDot');
const statusText = $('statusText');
const aiText = $('aiText');
const userText = $('userText');
const aiAttr = $('aiAttr');
const micBtn = $('micBtn');
const logoEl = $('logo');
const dynIsland = $('dynIsland');
const diText = $('diText');
const bondWavePath = $('bondWavePath');

function setState(s) {
  const prev = state;
  state = s;
  statusDot.className = 'status-dot ' + s;
  const labels = { idle:'EN ATTENTE', listening:"J'ÉCOUTE…", thinking:'…', speaking:'PARLE', ambient:'CONTINU' };
  statusText.textContent = labels[s] || 'EN ATTENTE';
  if (logoEl) logoEl.className = 'logo-img ' + s;
  // Mic VERT en mode conversation continue (peu importe l'état interne)
  // Sinon ROUGE par défaut
  if (_conversationMode || (s === 'listening' && _userInitiatedListen)) {
    micBtn.className = 'mic-btn user-listening';
  } else {
    micBtn.className = 'mic-btn';
  }
  document.body.classList.toggle('speaking-state', s === 'speaking');
  document.body.classList.toggle('listening-state', s === 'listening');
  document.body.classList.toggle('thinking-state', s === 'thinking');
  if (s === 'speaking') { dynIsland.classList.add('active'); diText.textContent = 'Sly parle…'; }
  else if (s === 'thinking') { dynIsland.classList.add('active'); diText.textContent = 'Sly réfléchit…'; }
  else if (s === 'listening') { dynIsland.classList.add('active'); diText.textContent = "J'écoute…"; }
  else { dynIsland.classList.remove('active'); }
  if (Settings.haptic && s !== prev) {
    if (s === 'listening') haptic(30);
    else if (s === 'speaking') haptic([20,40,20]);
  }
}

function showAI(text, attr) {
  aiText.textContent = text;
  $('transcriptBox').classList.add('visible');
  if (attr !== undefined) { aiAttr.textContent = attr; aiAttr.classList.add('visible'); }
  else aiAttr.classList.add('visible');
}
function showUser(text) {
  userText.textContent = text;
  userText.classList.toggle('visible', !!text);
  $('transcriptBox').classList.add('visible');

      console.warn('[sly][BUDGET] 80% atteint — ' + next + '/' + ELEVEN_BUDGET_MAX_CHARS + ' chars');

let _speakLock = false;

  if (_speakLock) {

    while (_speakLock && waited < 30000) {

      waited += 200;
    }
  }
  _speakLock = true;
  try {
  // Bloqueur 5€/mois : si dépassement, fallback voix navigateur (gratuit)
  if (!_budgetOk(text.length)) {

    try {
      if ('speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance(text);

        const voices = window.speechSynthesis.getVoices();
        const fr = voices.find(v => /fr/i.test(v.lang) && /male|homme|antoine|thomas/i.test(v.name)) || voices.find(v => /fr/i.test(v.lang));

        window.speechSynthesis.speak(u);

        setState('idle');
      }
    } catch(_) { setState('idle'); }
    return;
  }
  setState('speaking');
  animateBondWave();
  const voiceCfg = VOICES[Settings.voice] || VOICES.bond;
  let resp;
  try {
    resp = await fetch(
      'https://api.elevenlabs.io/v1/text-to-speech/' + voiceCfg.id + '/stream?optimize_streaming_latency=4&output_format=mp3_44100_128',
      {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'xi-api-key':ELEVEN_KEY },
        body: JSON.stringify({
          text,
          model_id: 'eleven_flash_v2_5',

    setState('idle');
    return;
  }
  if (!resp.ok) {
    let body = ''; try { body = await resp.text(); } catch(_){}
    console.error('[sly] eleven HTTP', resp.status, body.slice(0,200));
    if (resp.status === 401) showAI('Clé ElevenLabs invalide.');
    else if (resp.status === 429) showAI('Quota ElevenLabs dépassé.');
    else showAI('ElevenLabs erreur ' + resp.status);
    flashError();
    setState('idle');
    return;
  }
  try {
    const buf = await resp.arrayBuffer();
    if (buf.byteLength < 200) { setState('idle'); return; }
    const blob = new Blob([buf], { type:'audio/mpeg' });
    const url = URL.createObjectURL(blob);
    if (!_slyAudio) _slyAudio = new Audio();
    _slyAudio.src = url;
    _slyAudio.volume = (Settings.volume !== undefined) ? Settings.volume : 1;
    _slyAudio.onended = () => {
      URL.revokeObjectURL(url);
      setState('idle');
      if (_conversationMode) {
        setTimeout(() => { if (_conversationMode) startListen(); }, 500);
      }
    };
    _slyAudio.onerror = (e) => { console.error('[sly] audio err', e); URL.revokeObjectURL(url); setState('idle'); };
    try {
      await _slyAudio.play();
    } catch(playErr) {
      console.error('[sly] play() rejected — autoplay block iOS?', playErr.message);
      URL.revokeObjectURL(url);
      // Fallback Web Speech (gratuit, marche partout)
      try {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'fr-FR'; u.rate = 1.0;
        u.onend = () => { setState('idle'); if (_conversationMode) setTimeout(() => { if (_conversationMode) startListen(); }, 500); };
        window.speechSynthesis.speak(u);
      } catch(_) { setState('idle'); }
      return;
    }
  } catch(e) {
    console.error('[sly] play err', e.message);
    setState('idle');
  }
  } finally { _speakLock = false; }
}

let _waveRAF = null;
function animateBondWave() {
  if (!document.body.classList.contains('speaking-state')) {
    if (_waveRAF) { cancelAnimationFrame(_waveRAF); _waveRAF = null; }
    return;
  }
  const t = performance.now() * 0.001;
  const pts = [];
  for (let x = 0; x <= 1200; x += 30) {
    const y = 15 + Math.sin((x*0.012) + t*3) * 7 + Math.sin((x*0.025) - t*2) * 3;
    pts.push((x === 0 ? 'M' : 'L') + x + ',' + y.toFixed(1));
  }
  if (bondWavePath) bondWavePath.setAttribute('d', pts.join(' '));
  _waveRAF = requestAnimationFrame(animateBondWave);
}

// STT — Web Speech API
// ═══════════════════════════════════════════════════════════
function newRecog() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR();
  r.lang = 'fr-FR';
  r.continuous = false;
  r.interimResults = true;
  let finalText = '';
  r.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalText += t;
      else interim += t;
    }
    if (interim) showUser(interim.trim() + '…');
    if (finalText) showUser(finalText.trim());
  };
  r.onerror = (e) => {
    console.warn('[sly] recog err', e.error);
    listening = false;
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      showAI('Micro refusé. Autorise le micro dans Safari.');
    }
    setState('idle');
  };
  r.onend = () => {
    listening = false;
    const t = finalText.trim();
    finalText = '';
    if (t && state === 'listening') { handle(t); }
    else if (state === 'listening') setState('idle');
  };
  return r;
}
function startListen() {
  if (listening) return;
  recog = newRecog();
  if (!recog) { showAI("Ton navigateur ne supporte pas la reconnaissance vocale."); return; }
  try {
    recog.start();
    listening = true;
    _userTurnStartMs = Date.now();
    setState('listening');
  } catch(e) {
    console.warn('[sly] start fail, retry in 200ms', e.message);
    setTimeout(() => {
      try { recog = newRecog(); recog.start(); listening = true; setState('listening'); }
      catch(e2) { console.error('[sly] start fail final:', e2.message); setState('idle'); }
    }, 250);
  }
}
function stopListen() {
  if (!listening) return;
  try { recog && recog.stop(); } catch(_) {}
  listening = false;
}

    await speak(reply);
    return;

  const tlow = text.toLowerCase();

  // Pattern → skill mapping AVANT le conversationnel
  // (le bridge intent peut rater certaines variantes, on rattrape ici)
  const skillTriggers = [
    { match:['météo','meteo','quel temps','temps qu\'il fait','temps il fait','temps fait','temps de lyon','temps de charbonnières','temps demain'], skill:'weather_charbonnieres' },
    { match:['météo bangkok','météo thaï','temps bangkok'], skill:'weather_bangkok' },
    { match:['quelle heure','c\'est quelle heure','il est quelle heure'], skill:'now_time' },
    { match:['quel jour','on est quel jour','quelle date','quel est la date','c\'est quel jour'], skill:'now_date_human' },

    { match:['mes priorités','priorités du jour','mes priorités du jour','priorité du jour','prio du jour'], skill:'client_priorities' },
    { match:['mes blocages','mes bloqueurs','mes blockers','blocages clients'], skill:'client_blockers' },
    { match:['mes rappels','rappels du jour','reminders du jour','mes rappels jour'], skill:'reminder_today' },
    { match:['compte à rebours thaï','jours thaïlande','combien jours avant thaï','compte à rebours thailande'], skill:'reminder_thailande' },
    { match:['stoïque du jour','stoique du jour','citation du jour','phrase du jour'], skill:'stoic_du_jour' },
    { match:['que peut tu faire','qu\'est-ce que tu sais faire','que sais-tu faire','tes features'], skill:'sly_what_can_i_do' },
    { match:['mes clients','mes clients actifs','liste clients'], skill:'biz_clients_actifs_count' },
    { match:['naval','citation naval'], skill:'naval_ravikant' },
    { match:['marc aurèle','citation marc aurèle','marc aurele'], skill:'stoic_marc_aurele' },
    { match:['sénèque','citation sénèque','seneque','citation seneque'], skill:'stoic_seneque' },
  ];
  // Détecte mention client dans la phrase pour charger le contexte AVANT Claude
  let clientContextStr = '';
  try {
    const dc = await fetch('/api/skill/detect_client_in_text', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text}),signal:AbortSignal.timeout(3000)}).then(x => x.json());
    if (dc && dc.ok && dc.client_keyword) {
      const ctx = dc.context || {};

        const human = formatSkillResult(t.skill, r);
        if (human) { showAI(human); await speak(human); return; }
      } catch(_){}
    }
  }

  // Fallback conversationnel
  const conv = [
    { match:['tu m\'entends','tu entends','m\'entends-tu','tu me reçois','tu m écoutes','tu écoutes'], reply:["Oui je t'entends Augustin, cinq sur cinq.","Oui Augustin, je t'écoute, vas-y.","Présent, je t'entends bien."] },
    { match:['bonjour','salut','hello','hey','coucou'], reply:["Salut Augustin, je t'écoute.","Hey Augustin, prêt quand tu l'es.","Bonjour Augustin, dis-moi."] },
    { match:['bonsoir','bonne nuit'], reply:["Bonsoir Augustin.","Bonsoir, repose-toi bien."] },
    { match:['merci','t\'es cool','t es cool','bien joué'], reply:["Avec plaisir.","De rien Augustin.","À ton service."] },
    { match:['comment vas-tu','ça va','ca va','tu vas bien','t\'es là','t es là'], reply:["Présent, fluide. Et toi ?","Ça va, je suis là, dis-moi."] },
    { match:['ok','d\'accord','très bien','tres bien','parfait'], reply:["Reçu.","OK Augustin.","Compris."] },

    { match:['malade','pas en forme','pas la forme'], reply:["Hey, prends soin de toi. On simplifie tout aujourd'hui."] },

  for (const c of conv) {
    if (c.match.some(m => tlow.includes(m))) {

  // ═══ FALLBACK CLAUDE JARVIS x1000 ═══

    const useQuick = !wantsDepth;

    // Mood-aware instruction injection

                     mood === 'flat' ? '\n[Augustin est plat. Réponse concise, va à l\'essentiel.]' : '';
    const fullPrompt = SLY_SYSTEM_PROMPT
      + _workspaceMemory
      + smartContext
      + clientContextStr
      + _formatConvHistory()
      + moodHint
      + '\n\nAUGUSTIN VIENT DE DIRE: "' + text + '"\n\n'
      + 'Réponds en Jarvis x1000 : naturel, riche, avec une référence rare ou un parallèle inattendu si pertinent. Pas de "quelle commande tu veux lancer". Si question simple → réponse simple. Si profonde → 4-8 phrases denses, jamais un pavé. Toujours t\'adresser à "Augustin" jamais "Augus" ni "Auguste".';

  }

// Split intelligent en phrases pour streaming TTS perçu
function _splitIntoPhrases(text) {
  if (!text) return [];
  // Garde les ponctuations
  const parts = text.split(/([.!?…][\s\n])/);
  const out = [];
  let buf = '';
  for (const p of parts) {
    buf += p;
    if (/[.!?…][\s\n]$/.test(p)) {
      const s = buf.trim();
      if (s.length > 1) out.push(s);
      buf = '';
    }
  }
  if (buf.trim().length > 1) out.push(buf.trim());
  return out.length ? out : [text];
}

// Speak chaque phrase en séquence pour fluidité Jarvis
async function _streamSpeak(text) {
  const phrases = _splitIntoPhrases(text);
  if (phrases.length <= 1) return await speak(text);
  // Speak séquentiel : si user interrompt (state passes idle), on stop
  for (const phrase of phrases) {
    if (!_conversationMode && state === 'idle' && _slyAudio && !_slyAudio.paused) break;
    if (state === 'idle' && !_conversationMode) break;
    await speak(phrase);
    if (state === 'idle' && !_conversationMode) break;
  }
}

// CONFIRM DIALOG — protection actions Sly
// ═══════════════════════════════════════════════════════════
function askConfirm(title, msg) {
  return new Promise(resolve => {
    const overlay = $('confirmOverlay');
    $('confirmTitle').textContent = title;
    $('confirmMsg').textContent = msg;
    overlay.classList.add('active');
    haptic([10,30,10]);
    const cleanup = (val) => {
      overlay.classList.remove('active');
      $('confirmYes').onclick = null;
      $('confirmNo').onclick = null;
      resolve(val);
    };
    $('confirmYes').onclick = () => cleanup(true);
    $('confirmNo').onclick = () => cleanup(false);
  });
}

// FORMATTER — convertit un résultat skill JSON en phrase humaine vocalisable
// ═══════════════════════════════════════════════════════════
function formatSkillResult(skill, r) {
  if (!r || r.ok === false) return r && r.error ? 'Erreur : ' + r.error : null;
  // Phrases prioritaires
  if (r.phrase) return r.phrase + (r.application ? '. ' + r.application : '');
  if (r.message) return r.message;
  if (r.summary) return r.summary;
  if (r.fact) return r.fact;
  if (r.compliment) return r.compliment;
  if (r.haiku) return r.haiku;
  if (r.proverbe) return r.proverbe + (r.trad ? '. ' + r.trad : '');
  // Météo
  if (skill && skill.startsWith('weather_')) {
    const ville = skill.includes('bangkok') ? 'Bangkok' : skill.includes('chiang') ? 'Chiang Mai' : 'Charbonnières';
    if (r.temp_now !== undefined) {
      let s = `Il fait ${r.temp_now}° à ${ville}`;
      if (r.max_today !== undefined && r.min_today !== undefined) s += `, max ${r.max_today}, mini ${r.min_today}`;
      if (r.wind !== undefined) s += `, vent ${r.wind} km/h`;
      return s + '.';
    }
  }
  // MRR
  if (r.mrr_eur !== undefined) return `Ton MRR récurrent estimé : ${r.mrr_eur} euros par mois. Hors one-shots projets.`;
  // Compte à rebours Thaï
  if (r.jours_restants !== undefined && r.message) return r.message;
  if (r.jours_restants !== undefined) return `${r.jours_restants} jours restants.`;
  // Time
  if (r.time && r.date) return `Il est ${r.time}, on est le ${r.date}.`;
  if (r.human) return `On est ${r.human}.`;
  // Priorities
  if (r.priorities && Array.isArray(r.priorities)) return 'Tes priorités : ' + r.priorities.slice(0,3).join('. ');
  if (r.blockers && Array.isArray(r.blockers)) return r.blockers.length ? 'Bloqueurs : ' + r.blockers.join('. ') : 'Aucun bloqueur ouvert.';
  // Reminders
  if (r.reminders !== undefined) {
    const c = r.count || (r.reminders ? r.reminders.length : 0);
    if (c === 0) return 'Aucun rappel pour aujourd\'hui.';
    return `Tu as ${c} rappel${c > 1 ? 's' : ''} : ` + r.reminders.slice(0,3).map(x => x.text || '').filter(Boolean).join('. ');
  }
  // n8n list
  if (r.workflows && Array.isArray(r.workflows)) {
    const c = r.count || r.workflows.length;
    return `Tu as ${c} workflow${c > 1 ? 's' : ''} sur n8n.`;
  }
  if (r.client && r.brief) {
    return `${r.client}. ${r.brief.slice(0, 280)}`;
  }
  if (r.routine) {
    const acts = r.actions || r.instructions || [];
    return `Routine ${r.routine}. ${Array.isArray(acts) ? acts.slice(0,3).join('. ') : ''}`;
  }
  // Mode silence
  if (r.silence_minutes) return `Silence ${r.silence_minutes} minutes. Reprise vers ${r.reprise || 'plus tard'}.`;
  if (r.is_night !== undefined) return r.is_night ? 'On est en mode nuit.' : 'On n\'est pas en mode nuit.';
  // Top 10 / liste
  if (r.top_10 && Array.isArray(r.top_10)) return 'Top actions : ' + r.top_10.slice(0,3).join(', ');
  if (r.exemples && Array.isArray(r.exemples)) return 'Exemples : ' + r.exemples.slice(0,3).join(', ');
  // Recap
  if (r.actions_today !== undefined) return `Tu as fait ${r.actions_today} actions aujourd'hui via Sly.`;
  if (r.clients_status) return 'Status clients chargé. Voir le panel Outils.';
  return null;  // pas de format → on n'affiche rien de vocal
}

// Mode conversation continue (Augustin 03/05) :
// - 1er clic : démarre mode conv, mic devient vert, Sly écoute → répond → réécoute en boucle
// - 2e clic : termine la conv, mic redevient rouge
let _conversationMode = false;

micBtn.addEventListener('click', () => {
  if (_conversationMode) {
    // Termine la conversation
    _conversationMode = false;
    _userInitiatedListen = false;
    try { _slyAudio && _slyAudio.pause(); } catch(_){}
    stopListen();
    setState('idle');
    showAI('Conversation terminée.', '— Sly');
    return;
  }
  // Démarre la conversation
  _conversationMode = true;
  _userInitiatedListen = true;
  if (state === 'speaking') {
    try { _slyAudio && _slyAudio.pause(); } catch(_){}
  }
  startListen();
});

document.addEventListener('keydown', (e) => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA')) return;
  if ((e.ctrlKey && e.code === 'Space') || e.code === 'F9') {
    e.preventDefault();
    if (state === 'listening') { stopListen(); setState('idle'); }
    else startListen();
  } else if (e.code === 'Escape') {
    try { _slyAudio && _slyAudio.pause(); } catch(_){}
    stopListen(); setState('idle');
  } else if (e.key === 'v' || e.key === 'V') {
    toggleContinu();
  }
});

// Shuffle pour rotation aléatoire — pas toujours la même séquence
function _shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
let _continuQueue = _shuffleArray(CONTINU_PHRASES);
let _continuTimer = null;
let _continuIndex = 0;
async function _continuFire() {
  console.log('[sly][continu] fire — mode=' + continuMode + ' state=' + state);
  if (!continuMode) return;
  // Si Sly est en train de parler/écouter, retry plus court (était 30s c'est trop)
  if (state === 'speaking' || state === 'listening' || state === 'thinking') {
    _continuTimer = setTimeout(_continuFire, 5000);
    return;
  }
  if (_continuQueue.length === 0) _continuQueue = _shuffleArray(CONTINU_PHRASES);
  const phrase = _continuQueue.shift();
  _continuIndex++;
  console.log('[sly][continu] saying:', phrase.t.slice(0, 60));
  showAI(phrase.t, '— ' + phrase.a);
  try { await speak(phrase.t); } catch(e) { console.warn('[sly][continu] speak err:', e); }
  const intervalMs = (Settings.continuInterval || 300) * 1000;
  if (continuMode) _continuTimer = setTimeout(_continuFire, intervalMs);
}
function toggleContinu() {
  continuMode = !continuMode;
  const b = $('continuBtn');
  const skip = $('skipBtn');
  console.log('[sly][continu] toggle → ' + continuMode);
  if (continuMode) {
    if (b) b.classList.add('active');
    if (skip) skip.style.display = '';
    // CRUCIAL : unlock audio iOS DANS le user gesture (synchrone)
    try {
      if (!_slyAudio) { _slyAudio = new Audio(); _slyAudio.preload = 'auto'; }
      _slyAudio.muted = true;
      _slyAudio.src = 'data:audio/mpeg;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4LjEyLjEwMAAAAAAAAAAAAAAA//tQwAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCAgICAgICAgICAgICAgICAgIAAAAAAAAAA';
      _slyAudio.play().then(() => { _slyAudio.pause(); _slyAudio.currentTime = 0; _slyAudio.muted = false; _slyAudio.volume = Settings.volume || 1; _audioUnlocked = true; }).catch(() => {});
      if (typeof audioCtx !== 'undefined' && audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
    } catch(_){}
    if (_continuTimer) clearTimeout(_continuTimer);
    // Démarre TOUT DE SUITE après l'unlock (300ms pour laisser le silent audio finir)
    _continuTimer = setTimeout(_continuFire, 300);
  } else {
    if (b) b.classList.remove('active');
    if (skip) skip.style.display = 'none';
    if (_continuTimer) { clearTimeout(_continuTimer); _continuTimer = null; }
    try { _slyAudio && _slyAudio.pause(); } catch(_){}
    if (state === 'speaking') setState('idle');
  }
}
$('continuBtn').addEventListener('click', toggleContinu);

// Flèche skip → phrase suivante immédiate
$('skipBtn').addEventListener('click', () => {
  if (!continuMode) return;
  if (_continuTimer) { clearTimeout(_continuTimer); _continuTimer = null; }
  try { _slyAudio && _slyAudio.pause(); } catch(_){}
  if (state === 'speaking') setState('idle');
  haptic(20);
  _continuTimer = setTimeout(_continuFire, 200);
});

const toolsPanel = $('toolsPanel');
const toolsResult = $('toolsResult');
$('toolsBtn').addEventListener('click', () => toolsPanel.classList.add('open'));
$('toolsClose').addEventListener('click', () => toolsPanel.classList.remove('open'));
toolsPanel.querySelectorAll('.tool').forEach(btn => {
  btn.addEventListener('click', async () => {
    const act = btn.dataset.act || '';
    toolsResult.textContent = '⏳ ...';
    try {
      if (act.startsWith('open:')) {
        if (act.endsWith('history')) { window.open('/sly-history.html', '_blank'); toolsResult.textContent = '→ historique'; return; }
      }
      if (act.startsWith('skill:')) {
        const skill = act.split(':')[1];
        const r = await fetch('/api/skill/' + skill, {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'}).then(x => x.json());
        toolsResult.textContent = JSON.stringify(r, null, 2);
        const human = formatSkillResult(skill, r);
        if (human) { showAI(human); toolsPanel.classList.remove('open'); speak(human); }
      }
      if (act.startsWith('action:')) {
        const action = act.split(':')[1];
        if (action === 'camera') openCamera();

async function _proactiveBriefing() {

    if (last === todayStamp) return null; // déjà fait aujourd'hui
    const h = new Date().getHours();
    if (h > 11 || h < 6) return null; // pas le matin
    // Compose le briefing
    const parts = [];
    try {
      const r = await fetch('/api/skill/client_priorities', {method:'POST',headers:{'Content-Type':'application/json'},body:'{}',signal:AbortSignal.timeout(5000)}).then(x => x.json());
      if (r && r.priorities && r.priorities.length) parts.push("Priorité du jour : " + r.priorities[0]);
    } catch(_){}
    try {
      const r = await fetch('/api/skill/reminder_today', {method:'POST',headers:{'Content-Type':'application/json'},body:'{}',signal:AbortSignal.timeout(5000)}).then(x => x.json());
      if (r && r.count) parts.push(r.count + " rappel" + (r.count > 1 ? "s" : "") + " aujourd'hui");
    } catch(_){}
    try {
      const r = await fetch('/api/skill/weather_charbonnieres', {method:'POST',headers:{'Content-Type':'application/json'},body:'{}',signal:AbortSignal.timeout(5000)}).then(x => x.json());
      if (r && r.temp_now !== undefined) parts.push(r.temp_now + "° à Charbonnières, max " + (r.max_today || '?'));
    } catch(_){}
    try {
      const r = await fetch('/api/skill/stoic_du_jour', {method:'POST',headers:{'Content-Type':'application/json'},body:'{}',signal:AbortSignal.timeout(5000)}).then(x => x.json());
      if (r && r.phrase) parts.push(r.phrase);
    } catch(_){}
    if (!parts.length) return null;
    localStorage.setItem(lastKey, todayStamp);
    return "Bonjour Augustin. Briefing du jour : " + parts.join(". ") + ".";

let _ampCtx = null, _ampAnalyser = null, _ampSource = null, _ampRAF = null;
function setupAmplitude() {
  try {
    if (!_slyAudio) return;
    if (!_ampCtx) _ampCtx = new (window.AudioContext || window.webkitAudioContext)();

      _ampAnalyser.connect(_ampCtx.destination);
    }

function ampLoop() {
  if (state !== 'speaking' || !_ampAnalyser) {
    if (_ampRAF) cancelAnimationFrame(_ampRAF);

    return;

  for (let i = 0; i < data.length; i++) sum += data[i];
  const amp = sum / data.length / 255;
  const scale = 1 + amp * 0.18;
  if (logoEl) logoEl.style.transform = 'scale(' + scale.toFixed(3) + ')';
  _ampRAF = requestAnimationFrame(ampLoop);
}

let _vadCtx = null, _vadAnalyser = null, _vadStream = null, _vadRAF = null;
let _silenceStart = null;
const VAD_ENERGY_THRESHOLD = 0.015;  // énergie mic au-dessus = parle
const VAD_SILENCE_MS = 800;           // 800ms silence = fin de phrase

async function _ensureVAD() {
  if (_vadAnalyser) return _vadAnalyser;
  try {
    _vadStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    _vadCtx = new (window.AudioContext || window.webkitAudioContext)();
    _vadAnalyser = _vadCtx.createAnalyser();
    _vadAnalyser.fftSize = 512;
    const src = _vadCtx.createMediaStreamSource(_vadStream);
    src.connect(_vadAnalyser);
    return _vadAnalyser;
  } catch(e) {
    console.warn('[sly] VAD setup err:', e.message);
    return null;
  }
}

function _checkVoiceActivity() {
  if (!_vadAnalyser) return 0;
  const data = new Uint8Array(_vadAnalyser.frequencyBinCount);
  _vadAnalyser.getByteFrequencyData(data);
  let sum = 0;
  for (let i = 0; i < data.length; i++) sum += data[i];
  return sum / data.length / 255;
}

// Barge-in : si Augustin parle pendant que Sly parle → couper TTS dans 200ms
function _bargeInLoop() {
  if (state !== 'speaking') {
    if (_vadRAF) cancelAnimationFrame(_vadRAF);
    _vadRAF = null;
    return;
  }
  const energy = _checkVoiceActivity();
  if (energy > VAD_ENERGY_THRESHOLD) {
    console.log('[sly] barge-in détecté, énergie:', energy.toFixed(3));
    try { _slyAudio && _slyAudio.pause(); } catch(_){}
    setState('idle');
    haptic([10,30,10]);
    if (_conversationMode) setTimeout(startListen, 300);
    return;
  }
  _vadRAF = requestAnimationFrame(_bargeInLoop);
}

// MOOD DETECTION (P1 #16) — vitesse parole + longueur message
// ═══════════════════════════════════════════════════════════
let _userTurnStartMs = 0;
function _detectMood(text, durationMs) {
  const wordCount = text.split(/\s+/).length;
  const wordsPerSec = durationMs > 0 ? wordCount / (durationMs / 1000) : 2;
  const tlow = text.toLowerCase();
  const stressed = wordsPerSec > 4 || tlow.match(/(merde|putain|ça va pas|j'en peux plus|stress|panic|urgent)/);
  const flat = wordsPerSec < 1.5 || text.length < 20;
  const sad = tlow.match(/(triste|fatigué|seul|déprim|malade|pas bien|bof)/);
  const happy = tlow.match(/(super|génial|trop bien|content|happy|fier)/);
  if (sad) return 'sad';
  if (stressed) return 'stressed';
  if (happy) return 'happy';
  if (flat) return 'flat';
  return 'neutral';
}

// ═══════════════════════════════════════════════════════════
// VISION MODE (P1 #20) — capture caméra + send Claude vision
// ═══════════════════════════════════════════════════════════
async function _visionAnalyze() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    const v = document.createElement('video');
    v.srcObject = stream;
    v.playsInline = true;
    await v.play();
    await new Promise(r => setTimeout(r, 800));
    const c = document.createElement('canvas');
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    stream.getTracks().forEach(t => t.stop());
    const b64 = c.toDataURL('image/jpeg', 0.7);
    showAI('Photo prise, j\'analyse…');
    setState('thinking');
    try {
      // Sauve la photo
      await fetch('/api/skill/camera_glance', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image_b64:b64})}).then(r => r.json());
    } catch(_){}
    // Pour l'analyse, demande à Claude
    const prompt = SLY_SYSTEM_PROMPT + '\n\nAUGUSTIN VIENT DE TE MONTRER UNE PHOTO. Tu ne la vois pas directement (Claude CLI sub n\'a pas vision), mais tu peux lui demander ce qu\'il y a dessus et l\'aider. Réponds en disant que tu as bien sauvé la photo et demande-lui un mot pour l\'aider à l\'identifier.';
    try {
      const r = await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:prompt,quick:true}),signal:AbortSignal.timeout(15000)}).then(x => x.json());
      const reply = (r && (r.text || r.reply) || '').trim() || 'Photo sauvée Augustin. Décris-moi ce qu\'il y a dessus en deux mots et je t\'aide.';
      showAI(reply);
      await speak(reply);
    } catch(_){
      const r = 'Photo sauvée Augustin.';
      showAI(r); await speak(r);
    }
  } catch(e) {
    showAI('Caméra refusée Augustin.');
    setState('idle');
  }
}

// Trigger /vision dans le texte
function _checkVisionTrigger(text) {
  const tlow = text.toLowerCase().trim();
  return tlow === '/vision' || tlow.startsWith('vision ') || tlow.includes('regarde ça') || tlow.includes('regarde cette photo') || tlow.includes('prends une photo');
}

// ═══════════════════════════════════════════════════════════
// LATENCY TELEMETRY (P1 #25)
// ═══════════════════════════════════════════════════════════
const _latencyLog = [];
function _logLatency(stage, ms) {
  _latencyLog.push({stage, ms, ts: Date.now()});
  if (_latencyLog.length > 100) _latencyLog.shift();
  console.log('[sly][latency] ' + stage + ': ' + ms + 'ms');
}
window._slyLatencyStats = () => {
  const groups = {};
  for (const l of _latencyLog) {
    groups[l.stage] = groups[l.stage] || [];
    groups[l.stage].push(l.ms);
  }
  const stats = {};
  for (const k in groups) {
    const arr = groups[k]; arr.sort((a,b) => a-b);
    stats[k] = { avg: Math.round(arr.reduce((a,b)=>a+b,0)/arr.length), p50: arr[Math.floor(arr.length/2)], p95: arr[Math.floor(arr.length*0.95)], n: arr.length };
  }
  return stats;
};

// PERSONA DRIFT GUARD (P1 #15) — toutes les 10 turns, vérifie que Sly reste Sly
// ═══════════════════════════════════════════════════════════
let _driftCounter = 0;
function _personaDriftCheck() {
  _driftCounter++;
  if (_driftCounter < 10) return;
  _driftCounter = 0;
  // Simple : on vérifie que les dernières réponses ne contiennent pas de phrases interdites
  const turns = _readConvHistory().slice(-5).filter(t => t.role === 'sly');
  const drifts = ['en tant qu\'ia','je suis chatgpt','je suis claude','quelle commande','que veux-tu faire','listes à puces',';',';',';'];
  for (const t of turns) {
    const tl = t.text.toLowerCase();
    for (const d of drifts) {
      if (tl.includes(d)) {
        console.warn('[sly] persona drift detected:', d, 'in:', t.text.slice(0,80));
        // Force reset : reload le system prompt en injectant un rappel
        return true;
      }
    }
  }
  return false;
}
